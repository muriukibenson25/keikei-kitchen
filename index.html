<script>
// ── Automatic daily close migration ─────────────────────────────────────
// NOTE: This function used to auto-detect date changes and "close the day"
// by archiving orders/cashLog/expenseLog/adjustments/kitchenLog/closingStock
// into a one-off snapshot key and then DELETING them from their live keys.
// That was a serious bug: those keys hold the FULL historical record (every
// order/expense ever entered, filtered by date elsewhere for daily/monthly/
// all-time reports) — not just "today's" data. Because this function ran on
// every login, it would silently wipe the entire order/expense history the
// first time the app was opened on a new calendar day, into an archive key
// that nothing else in the app ever reads back.
//
// The app already has a correct, manual, PIN-gated Close Day / Open Day flow
// (see confirmCloseDay / confirmOpenDay) that advances currentDate without
// deleting any history. This function is now a safe no-op kept only so the
// window.runDailyCloseMigration() call site doesn't need to change.
function runDailyCloseMigration() {
  // Intentionally does nothing. See note above.
}
window.runDailyCloseMigration = runDailyCloseMigration;
</script>
<script>
const {
  useState,
  useEffect,
  useRef,
  useMemo,
  useCallback
} = React;

// ── Validation Helpers ──────────────────────────────────────────────────
function validatePositiveNumber(value, min = 0, max = 999999) {
  var num = parseFloat(value);
  if (isNaN(num)) return min;
  if (num < min) return min;
  if (num > max) return max;
  return Math.round(num * 100) / 100;
}

function validateInteger(value, min = 0, max = 999999) {
  var num = parseInt(value, 10);
  if (isNaN(num)) return min;
  if (num < min) return min;
  if (num > max) return max;
  return num;
}

// ── localStorage persistence helpers ─────────────────────────────────
const LS_KEY = 'kkitchen_v1';
var _CORRUPTION_LOG = [];
function lsLoad(key, fallback) {
  try {
    var raw = localStorage.getItem(LS_KEY + '_' + key);
    if (!raw) return fallback;
    var parsed = JSON.parse(raw);
    return parsed;
  } catch (e) {
    var error = '[Data Corruption] Failed to load ' + key + ': ' + e.message;
    console.error(error);
    _CORRUPTION_LOG.push({
      key: key,
      error: e.message,
      timestamp: new Date().toISOString()
    });
    return fallback;
  }
}
// Debounced save: large objects (orders, inv, cashLog) are serialised at most once
// per 50ms for critical financial data, 150ms for others.
// This prevents data loss on browser crash while maintaining performance.
var _lsTimers = {};
var _lsPending = {};
var _CRITICAL_KEYS = ['orders', 'cashLog', 'drawer', 'expenseLog'];
// ── Cloud-sync race protection ────────────────────────────────────────
// Not prefixed with LS_KEY/LS_PREFIX so it's never touched by the cloud
// snapshot delete/restore cycle in applySnapshotToLocalStorage.
// Tracks the last time ANY local data was written, and the last time that
// data was successfully pushed to the cloud, so pullSnapshot() can tell
// whether local has changes the cloud doesn't know about yet (e.g. a
// refresh happened before the beforeunload push finished) and avoid
// clobbering them with a stale cloud copy.
var SYNC_META_LOCAL_WRITE_KEY = 'kk_sync_meta_lastLocalWrite';
function markLocalWrite() {
  try { localStorage.setItem(SYNC_META_LOCAL_WRITE_KEY, new Date().toISOString()); } catch (e) {}
}
// Debounced near-real-time cloud push, separate from the 30s auto-sync
// interval, so edits reach the cloud within a couple seconds instead of
// only on the next interval tick / tab-hide / unload.
var _cloudSyncTimer = null;
function scheduleCloudSync() {
  if (_cloudSyncTimer) clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer = setTimeout(function () {
    _cloudSyncTimer = null;
    if (window.pushSnapshot && window.getCurrentUid) {
      var uid = window.getCurrentUid();
      if (uid) window.pushSnapshot(uid);
    }
  }, 2000);
}
function lsSave(key, val) {
  if (_lsTimers[key]) clearTimeout(_lsTimers[key]);
  _lsPending[key] = val;
  var delay = _CRITICAL_KEYS.indexOf(key) >= 0 ? 50 : 150;
  _lsTimers[key] = setTimeout(function () {
    _lsTimers[key] = null;
    delete _lsPending[key];
    try {
      localStorage.setItem(LS_KEY + '_' + key, JSON.stringify(val));
      markLocalWrite();
      scheduleCloudSync();
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        console.error('[Storage Error] LocalStorage quota exceeded. App will continue but data may not persist.');
        alert('⚠️ Storage full. Please export your data and clear space.');
      } else {
        console.error('[Storage Error] Failed to save ' + key + ':', e);
      }
    }
  }, delay);
}
// Flush all pending saves immediately (called before export / hard reset,
// and on tab close/hide) — writes the latest pending value for each key
// instead of merely cancelling the scheduled write.
function lsFlush() {
  Object.keys(_lsTimers).forEach(function (key) {
    if (_lsTimers[key]) {
      clearTimeout(_lsTimers[key]);
      _lsTimers[key] = null;
    }
    if (Object.prototype.hasOwnProperty.call(_lsPending, key)) {
      try {
        localStorage.setItem(LS_KEY + '_' + key, JSON.stringify(_lsPending[key]));
        markLocalWrite();
      } catch (e) {}
      delete _lsPending[key];
    }
  });
}
// Transaction logging for audit trail
var _TRANSACTION_LOG = [];
var _MAX_TRANSACTIONS = 10000; // Store last 10k transactions
function logTransaction(action, type, details) {
  var entry = {
    id: _TRANSACTION_LOG.length + 1,
    timestamp: new Date().toISOString(),
    action: action,
    type: type,
    details: details || {}
  };
  _TRANSACTION_LOG.push(entry);
  
  // Keep log size bounded
  if (_TRANSACTION_LOG.length > _MAX_TRANSACTIONS) {
    _TRANSACTION_LOG.shift();
  }
  
  // Save transaction log
  try {
    lsSave('transactionLog', _TRANSACTION_LOG);
  } catch (e) {
    console.error('[Logging Error]', e);
  }
  
  return entry;
}

// Load transaction log on startup
_TRANSACTION_LOG = lsLoad('transactionLog', []);

// ── Data Validation ─────────────────────────────────────────────────────
var _VALIDATION_ERRORS = [];
function validateExportData(data, type) {
  var errors = [];
  
  if (type === 'orders' && Array.isArray(data)) {
    data.forEach(function(order, idx) {
      if (typeof order.total !== 'number' || order.total < 0) {
        errors.push('Order ' + idx + ': Invalid total ' + order.total);
      }
      if (!Array.isArray(order.items)) {
        errors.push('Order ' + idx + ': Missing items array');
      }
      var itemsTotal = (order.items || []).reduce(function(sum, item) {
        return sum + (item.price * item.qty || 0);
      }, 0);
      if (Math.abs(itemsTotal - order.total) > 1) {
        errors.push('Order ' + idx + ': Total mismatch (items=' + itemsTotal + ', total=' + order.total + ')');
      }
    });
  }
  
  if (type === 'cashLog' && Array.isArray(data)) {
    data.forEach(function(entry, idx) {
      if (typeof entry.amount !== 'number' || isNaN(entry.amount)) {
        errors.push('Cash entry ' + idx + ': Invalid amount');
      }
    });
  }
  
  if (errors.length > 0) {
    _VALIDATION_ERRORS = errors;
    console.warn('[Validation] ' + errors.length + ' issues found in ' + type + ':', errors);
  }
  
  return errors.length === 0;
}

// ── Backup & Export ────────────────────────────────────────────────────
function exportDataAsJSON() {
  lsFlush(); // Ensure all pending saves are written
  
  var backup = {
    exportDate: new Date().toISOString(),
    appVersion: '3.2-FIXED',
    data: {
      orders: lsLoad('orders', []),
      cashLog: lsLoad('cashLog', []),
      expenseLog: lsLoad('expenseLog', []),
      drawer: lsLoad('drawer', {}),
      inv: lsLoad('inv', {}),
      adjustments: lsLoad('adjustments', []),
      menuItems: lsLoad('menuItems', []),
      transactionLog: lsLoad('transactionLog', []),
      validationErrors: _VALIDATION_ERRORS
    },
    metadata: {
      kitchenName: lsLoad('kitchenName', 'Kei Kei\'s Kitchen'),
      currentDate: lsLoad('currentDate', new Date().toISOString().split('T')[0]),
      dayOpen: lsLoad('dayOpen', false),
      lastExport: new Date().toISOString()
    }
  };
  
  // Validate before exporting
  validateExportData(backup.data.orders, 'orders');
  validateExportData(backup.data.cashLog, 'cashLog');
  
  // Create downloadable file
  var json = JSON.stringify(backup, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'kkitchen-backup-' + new Date().toISOString().split('T')[0] + '.json';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  
  logTransaction('SYSTEM', 'DATA_EXPORT', { fileName: link.download, size: json.length });
  console.log('[Backup] Data exported successfully');
}

// Auto-backup hint: Store last export time and warn user if older than 7 days
var _LAST_EXPORT = lsLoad('lastExportTime', null);
function shouldRemindBackup() {
  if (!_LAST_EXPORT) return true;
  var lastBackup = new Date(_LAST_EXPORT);
  var daysSinceBackup = (Date.now() - lastBackup) / (1000 * 60 * 60 * 24);
  return daysSinceBackup > 7;
}

// Make sure nothing is lost if the tab is closed, refreshed, or backgrounded
// within the debounce window (e.g. right after ringing up an order).
window.addEventListener('beforeunload', lsFlush);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') lsFlush();
});
async function lsClear() {
  // Require explicit confirmation before clearing all data
  var confirmed = confirm(
    '🚨 WARNING: This will DELETE ALL data including orders, expenses, and cash logs.\n\n' +
    'This action CANNOT be undone.\n\n' +
    'Type "DELETE ALL DATA" below to confirm:'
  );
  
  if (!confirmed) {
    console.log('[Clear] User cancelled data deletion');
    return false;
  }
  
  lsFlush();
  logTransaction('SYSTEM', 'HARD_RESET', { reason: 'User initiated hard reset' });
  
  try {
    ['orders', 'expenseLog', 'cashLog', 'drawer', 'inv', 'adjustments', 'menuItems', 'menuStockLevels', 'menuStockAdjustments', 'stockAdjustments', 'kitchenName', 'lastSyncTime', 'currentDate', 'dayOpen', 'dayClosedAt', 'suppliers', 'capitalInjections', 'ownerLoans', 'financiers', 'kitchenLog', 'ingCostOverrides', 'closingStock', 'purchaseOrders', 'requisitions', 'employees', 'payrollPayments', 'labourOverheadPct', 'utilitiesOverheadPct', 'transactionLog'].forEach(function (k) {
      localStorage.removeItem(LS_KEY + '_' + k);
    });
    console.log('[Clear] All data cleared locally');

    // Cloud-synced accounts pull the last cloud snapshot down on every reload,
    // which would silently undo this reset. Force-push the now-cleared local
    // state to the cloud first so there's nothing stale left to pull back down.
    // Guarded with a timeout so a slow/offline connection can't hang the reset.
    if (window.pushSnapshot && window.getCurrentUid) {
      var uid = window.getCurrentUid();
      if (uid) {
        try {
          await Promise.race([
            window.pushSnapshot(uid),
            new Promise(function (resolve) { setTimeout(resolve, 5000); })
          ]);
          console.log('[Clear] Cloud snapshot synced');
        } catch (syncErr) {
          console.error('[Clear] Cloud sync failed, reset stayed local only', syncErr);
        }
      }
    }

    alert('✓ All data has been cleared. Page will reload.');
    window.location.reload();
    return true;
  } catch (e) {
    console.error('[Clear Error]', e);
    alert('❌ Error clearing data: ' + e.message);
    return false;
  }
}

    sh.appendRow(["Kei Kei's Kitchen — Orders for " + date]);

    sh.appendRow([]); // spacer

    // Headers (row 3)
    sh.appendRow(["#","Time","Type","Payment","Status","Items","Qty","Total (Kes)","Note"]);
    formatHeader(sh, 3);
    sh.setFrozenRows(3);

    dayOrders.forEach(function(o) {

      var items = (o.items || []).map(function(i) {
        var tag = i.lineType ? " [" + (i.lineType === "dine-in" ? "DI" : i.lineType === "takeaway" ? "TA" : "DEL") + "]" : "";
        return i.name + tag + " x" + i.qty + " @ Kes " + i.price;

                    : o.type === "takeaway" ? "Takeaway"
                    : o.type === "delivery" ? "Delivery" : o.type || "";
      var status    = o.unpaid ? "Open Tab" : "Paid";
      var payment   = o.unpaid ? "Tab" : (o.payment || "");

      sh.appendRow([o.no, o.time, typeLabel, payment, status,
                    items, o.itemCount, o.total, o.note || ""]);

      if (!o.unpaid) {
        if (o.payment === "cash")  cashTotal  += o.total;

      } else {
        tabTotal += o.total;
      }
      grandTotal += o.total;
      orderCount++;

    var firstDataRow = 4;
    var dataRowCount = sh.getLastRow() - 3;
    if (dataRowCount > 0) {

    }

    // Spacer
    sh.appendRow([]);

    // Daily summary block
    var sumStart = sh.getLastRow() + 1;
    var sumRows = [
      ["DAILY SUMMARY", ""],
      ["Total Orders",  orderCount],
      ["Cash Sales",    cashTotal],
      ["M-Pesa Sales",  mpesaTotal],
      ["Open Tabs",     tabTotal],
      ["TOTAL REVENUE", grandTotal],
    ];

    sumRange.setBackground("#2E1E12").setFontColor("#F7EDD8");
    sh.getRange(sumStart,   1).setFontWeight("bold").setFontColor("#E07B39").setFontSize(11);
    sh.getRange(sumStart+5, 1, 1, 2).setFontWeight("bold").setFontColor("#D4A853").setFontSize(11);
    sh.getRange(sumStart+2, 2, 4, 1).setNumberFormat("#,##0");

    sh.setColumnWidth(6, 280); // Items column
    autoResizeCols(sh, [6]); // resize all except col 6

function writeDailySummary(ss, orders, expenses) {

// ─────────────────────────────────────────────────────────────────────
// EXPENSES
// ─────────────────────────────────────────────────────────────────────
function writeExpenses(ss, expenses) {
  var sh = ss.getSheetByName("Expenses") || ss.insertSheet("Expenses");
  sh.clearContents();
  sh.appendRow(["Date","Time","Category","Type","Description","Amount (Kes)","Pay Method"]);
  formatHeader(sh, 1);

  var COGS_CATS = ["stock","delivery"];
  expenses.forEach(function(e) {
    var lines = e.lines || [{cat: e.cat || "other", desc: e.desc || "", amount: e.amount || 0}];
    lines.forEach(function(l) {
      var ltype = COGS_CATS.indexOf(l.cat) > -1 ? "COGS" : "OpEx";
      sh.appendRow([e.date||"", e.time||"", l.cat||"", ltype,
                    l.desc||"", parseFloat(l.amount)||0, e.payMethod||""]);
    });
  });

  var dataRows = sh.getLastRow() - 1;
  if (dataRows > 0) sh.getRange(2, 6, dataRows, 1).setNumberFormat("#,##0");
  autoResizeCols(sh);
}

// ─────────────────────────────────────────────────────────────────────
// CASH LOG
// ─────────────────────────────────────────────────────────────────────
function writeCashLog(ss, cashLog) {
  var sh = ss.getSheetByName("Cash Log") || ss.insertSheet("Cash Log");
  sh.clearContents();
  sh.appendRow(["Date","Time","Type","Method","Direction","Amount (Kes)","Note"]);
  formatHeader(sh, 1);

    sh.appendRow([l.date||"", l.time||"", l.type||"",
                  l.method||"", l.dir||"", parseFloat(l.amt)||0, l.note||""]);
  });

  var dataRows = sh.getLastRow() - 1;
  if (dataRows > 0) sh.getRange(2, 6, dataRows, 1).setNumberFormat("#,##0");
  autoResizeCols(sh);
}

// ─────────────────────────────────────────────────────────────────────
// INVENTORY SNAPSHOT
// ─────────────────────────────────────────────────────────────────────
function writeInventory(ss, inv) {
  var sh = ss.getSheetByName("Inventory") || ss.insertSheet("Inventory");
  sh.clearContents();
  sh.appendRow(["ID","Name","Category","Unit","Stock","Reorder Level",
                "Cost/Unit (Kes)","Stock Value (Kes)","Status"]);
  formatHeader(sh, 1);

  inv.forEach(function(i) {
    var stock   = parseFloat(i.stock)   || 0;
    var reorder = parseFloat(i.reorder) || 0;
    var cost    = parseFloat(i.costPer) || 0;
    var status  = stock <= 0            ? "OUT OF STOCK"
                : stock <= reorder      ? "LOW — Reorder"
                : stock <= reorder*1.5  ? "Running Low"
                : "OK";
    sh.appendRow([i.id, i.name||"", i.cat||"", i.unit||"",
                  stock, reorder, cost, stock*cost, status]);
  });

  var dataRows = sh.getLastRow() - 1;
  if (dataRows > 0) {
    sh.getRange(2, 5, dataRows, 1).setNumberFormat("#,##0.00"); // Stock
    sh.getRange(2, 7, dataRows, 2).setNumberFormat("#,##0.00"); // Cost + Value

  if (dataRows > 0) {
    var statusRange = sh.getRange(2, 9, dataRows, 1).getValues();

      else                                cell.setBackground("#2D6A2D").setFontColor("#fff");
    });
  }
  autoResizeCols(sh);
}

function formatHeader(sh, row) {
  var r   = row || 1;
  var hdr = sh.getRange(r, 1, 1, Math.max(sh.getLastColumn(), 1));
  hdr.setBackground("#E07B39").setFontColor("#FFFFFF").setFontWeight("bold").setFontSize(10);

}

  var n = sh.getLastColumn();
  if (n < 1) return;
  for (var c = 1; c <= n; c++) {
    if (skipCols && skipCols.indexOf(c) > -1) continue;

<script type="module">
// ════════════════════════════════════════════════════════════════════════════
// CLOUD AUTH + SYNC BRIDGE
// Wraps the existing localStorage-based app with Firebase login and a
// pull-on-login / push-on-interval sync, without touching the app's
// internal logic. The app itself still reads/writes localStorage exactly
// as before — this layer just keeps that localStorage mirrored to Firestore
// per hotel account so data follows the account across devices.
// ════════════════════════════════════════════════════════════════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, getDocs, collection, updateDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlTNGI8naQNnbi40cTB-UQJTZO0FF-Exk",
  authDomain: "keikei-kitchen.firebaseapp.com",
  projectId: "keikei-kitchen",
  storageBucket: "keikei-kitchen.firebasestorage.app",
  messagingSenderId: "394274897977",
  appId: "1:394274897977:web:4a36ea8865b3419ae10de8",
  measurementId: "G-QKLFEJLQ8S"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const ADMIN_EMAIL = "muriukibenson25@gmail.com";
const LS_PREFIX = "kkitchen_v1";

let currentUser = null;
let syncTimer = null;
let kitchenMounted = false;
let handledUid = null;

function friendlyError(e) {
  const code = e && e.code ? e.code : '';
  const map = {
    'auth/email-already-in-use': 'That email is already registered. Try signing in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed': 'Network error — check your internet connection.'
  };
  return map[code] || (e && e.message ? e.message : 'Something went wrong. Please try again.');
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Local <-> cloud snapshot bridge ─────────────────────────────────
function collectLocalSnapshot() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.indexOf(LS_PREFIX) === 0) data[key] = localStorage.getItem(key);
  }
  return data;
}

function applySnapshotToLocalStorage(data) {
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (key && key.indexOf(LS_PREFIX) === 0) localStorage.removeItem(key);
  }
  Object.keys(data || {}).forEach(k => localStorage.setItem(k, data[k]));
}

async function pullSnapshot(uid) {
  try {
    // Guard against clobbering a fresh local edit with a stale cloud copy.
    // If local was written more recently than it was last successfully
    // pushed, the cloud doesn't have the latest change yet (e.g. the page
    // was refreshed before the beforeunload push finished) — push local up
    // first instead of overwriting it with what's currently in the cloud.
    const lastLocalWrite = localStorage.getItem('kk_sync_meta_lastLocalWrite');
    const lastPushedAt = localStorage.getItem('kk_sync_meta_lastPushedAt');
    const hasUnsyncedLocalChanges = !!lastLocalWrite && (!lastPushedAt || lastLocalWrite > lastPushedAt);
    if (hasUnsyncedLocalChanges) {
      console.log('[Cloud] Unsynced local changes detected on load — pushing before pulling');
      await pushSnapshot(uid);
      return;
    }
    const snap = await getDoc(doc(db, 'hotels', uid, 'appdata', 'snapshot'));
    applySnapshotToLocalStorage(snap.exists() ? (snap.data().data || {}) : {});
  } catch (e) {
    console.error('[Cloud] pull failed, using local cache', e);
  }
}

async function pushSnapshot(uid) {
  try {
    const ts = new Date().toISOString();
    await setDoc(doc(db, 'hotels', uid, 'appdata', 'snapshot'), {
      data: collectLocalSnapshot(),
      updatedAt: ts
    });
    try { localStorage.setItem('kk_sync_meta_lastPushedAt', ts); } catch (e) {}
    setSyncStatus(true);
  } catch (e) {
    console.error('[Cloud] push failed', e);
    setSyncStatus(false);
  }
}
// Exposed so a local "Reset All Data" (triggered from the non-module app script)
// can force-push the cleared state to the cloud BEFORE reloading — otherwise the
// next pullSnapshot() on reload would pull the old data straight back down.
window.pushSnapshot = pushSnapshot;
window.getCurrentUid = function () { return currentUser ? currentUser.uid : null; };

function startAutoSync(uid) {
  stopAutoSync();
  syncTimer = setInterval(() => pushSnapshot(uid), 30000);
  window.addEventListener('beforeunload', () => { pushSnapshot(uid); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') pushSnapshot(uid);
  });
}
function stopAutoSync() {
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = null;
}

// ── Auth actions ─────────────────────────────────────────────────
async function registerHotel(email, password, hotelName) {
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const now = new Date().toISOString();
    await setDoc(doc(db, 'hotels', cred.user.uid), { email, hotelName, createdAt: now, lastLogin: now });
    return { success: true };
  } catch (e) {
    return { success: false, error: friendlyError(e) };
  }
}

async function loginHotel(email, password) {
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await updateDoc(doc(db, 'hotels', cred.user.uid), { lastLogin: new Date().toISOString() });
    return { success: true };
  } catch (e) {
    return { success: false, error: friendlyError(e) };
  }
}

async function getHotelProfile(uid) {
  const snap = await getDoc(doc(db, 'hotels', uid));
  return snap.exists() ? snap.data() : null;
}

// ── Admin data ───────────────────────────────────────────────────
async function getAllHotelsSummary() {
  const snap = await getDocs(collection(db, 'hotels'));
  const results = [];
  for (const hDoc of snap.docs) {
    const uid = hDoc.id;
    const profile = hDoc.data();
    let todayOrders = 0, todayRevenue = 0, totalOrders = 0;
    try {
      const dataSnap = await getDoc(doc(db, 'hotels', uid, 'appdata', 'snapshot'));
      if (dataSnap.exists()) {
        const raw = dataSnap.data().data || {};
        const orders = raw[LS_PREFIX + '_orders'] ? JSON.parse(raw[LS_PREFIX + '_orders']) : [];
        const today = raw[LS_PREFIX + '_currentDate'] ? JSON.parse(raw[LS_PREFIX + '_currentDate']) : new Date().toISOString().split('T')[0];
        const todays = orders.filter(o => o.date === today && !o.voided);
        todayOrders = todays.length;
        todayRevenue = todays.reduce((s, o) => s + (o.total || 0), 0);
        totalOrders = orders.length;
      }
    } catch (e) { /* skip hotel with unreadable data */ }
    results.push({ uid, hotelName: profile.hotelName, email: profile.email, lastLogin: profile.lastLogin, todayOrders, todayRevenue, totalOrders });
  }
  return results;
}

// ── UI ───────────────────────────────────────────────────────────
function showLoading(text) {
  const gate = document.getElementById('authGate');
  gate.style.display = 'block';
  gate.innerHTML = `<div class="ag-loading"><div class="ag-spinner"></div><div class="ag-loading-text">${escapeHtml(text)}</div></div>`;
  document.getElementById('root').style.display = 'none';
  document.getElementById('cloudToolbar').style.display = 'none';
}

function renderAuthForm() {
  let isSignUp = false, error = '', submitting = false;
  const gate = document.getElementById('authGate');
  document.getElementById('root').style.display = 'none';
  document.getElementById('cloudToolbar').style.display = 'none';
  gate.style.display = 'block';

  function render() {
    gate.innerHTML = `
      <div class="ag-center">
        <div class="ag-box">
          <h1>Kei Kei's Kitchen</h1>
          <p class="ag-subtitle">Cloud-synced management system</p>
          <div class="ag-form">
            ${isSignUp ? `<input type="text" id="agHotelName" placeholder="Hotel/Restaurant Name" />` : ''}
            <input type="email" id="agEmail" placeholder="Email address" />
            <input type="password" id="agPassword" placeholder="Password" />
            ${error ? `<div class="ag-error">${escapeHtml(error)}</div>` : ''}
            <button class="ag-btn-primary" id="agSubmit" ${submitting ? 'disabled' : ''}>${submitting ? 'Please wait…' : (isSignUp ? 'Create Account' : 'Sign In')}</button>
            <button class="ag-btn-secondary" id="agToggle" ${submitting ? 'disabled' : ''}>${isSignUp ? 'Already have an account? Sign in' : 'New location? Create account'}</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('agSubmit').addEventListener('click', async () => {
      const email = document.getElementById('agEmail').value.trim();
      const password = document.getElementById('agPassword').value;
      const hotelName = isSignUp ? document.getElementById('agHotelName').value.trim() : '';

      if (!email || !password) { error = 'Please fill in all fields'; render(); return; }
      if (isSignUp && !hotelName) { error = 'Hotel name is required'; render(); return; }

      submitting = true; error = ''; render();
      const result = isSignUp ? await registerHotel(email, password, hotelName) : await loginHotel(email, password);
      submitting = false;
      if (!result.success) { error = result.error; render(); }
    });

    document.getElementById('agToggle').addEventListener('click', () => {
      isSignUp = !isSignUp; error = ''; render();
    });
  }
  render();
}

function renderToolbar(isAdmin, view) {
  const bar = document.getElementById('cloudToolbar');
  bar.style.display = 'flex';
  bar.innerHTML = `
    <span class="ct-status" id="ctStatus"><span class="ct-dot"></span>Synced</span>
    ${isAdmin ? `<button id="ctAdminBtn" class="${view === 'admin' ? 'ct-admin' : ''}">${view === 'admin' ? '🍳 My Kitchen' : '📊 Admin'}</button>` : ''}
    <button id="ctLogoutBtn">Sign out</button>
  `;
  if (isAdmin) {
    document.getElementById('ctAdminBtn').addEventListener('click', () => {
      if (view === 'admin') showKitchenApp(); else showAdminView();
    });
  }
  document.getElementById('ctLogoutBtn').addEventListener('click', async () => {
    if (currentUser) await pushSnapshot(currentUser.uid);
    stopAutoSync();
    await signOut(auth);
    location.reload();
  });
}

function setSyncStatus(ok) {
  const el = document.getElementById('ctStatus');
  if (!el) return;
  el.className = 'ct-status' + (ok ? '' : ' offline');
  el.innerHTML = `<span class="ct-dot"></span>${ok ? 'Synced' : 'Sync issue'}`;
}

function showKitchenApp() {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('root').style.display = 'block';
  if (!kitchenMounted) {
    window.runDailyCloseMigration();
    window.mountKitchenApp();
    kitchenMounted = true;
  }
  renderToolbar(currentUser.isAdmin, 'kitchen');
}

async function showAdminView() {
  document.getElementById('root').style.display = 'none';
  const gate = document.getElementById('authGate');
  gate.style.display = 'block';
  gate.innerHTML = `<div class="ag-loading"><div class="ag-spinner"></div><div class="ag-loading-text">Loading all locations…</div></div>`;
  renderToolbar(true, 'admin');

  const hotels = await getAllHotelsSummary();
  gate.innerHTML = `
    <div class="ag-admin-wrap">
      <div class="ag-admin-header"><h1>All Locations</h1></div>
      <div class="ag-hotel-grid">
        ${hotels.map(h => `
          <div class="ag-hotel-card">
            <div class="ag-hotel-name">${escapeHtml(h.hotelName || h.email)}</div>
            <div class="ag-hotel-email">${escapeHtml(h.email)}</div>
            <div class="ag-hotel-stats">
              <div class="ag-hotel-stat"><div class="ag-hotel-stat-label">Today</div><div class="ag-hotel-stat-value">Kes ${h.todayRevenue.toLocaleString()}</div></div>
              <div class="ag-hotel-stat accent"><div class="ag-hotel-stat-label">Orders</div><div class="ag-hotel-stat-value">${h.todayOrders}</div></div>
            </div>
            <div class="ag-hotel-details">
              <div>Last active: ${h.lastLogin ? new Date(h.lastLogin).toLocaleString() : '—'}</div>
              <div>Total orders: ${h.totalOrders}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Orchestration ────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    if (handledUid === user.uid) return;
    handledUid = user.uid;
    showLoading('Syncing your data…');
    const profile = await getHotelProfile(user.uid);
    currentUser = {
      uid: user.uid,
      email: user.email,
      hotelName: profile ? profile.hotelName : user.email,
      isAdmin: user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
    };
    await pullSnapshot(user.uid);
    startAutoSync(user.uid);
    showKitchenApp();
  } else {
    handledUid = null;
    currentUser = null;
    stopAutoSync();
    renderAuthForm();
  }
});
</script>
